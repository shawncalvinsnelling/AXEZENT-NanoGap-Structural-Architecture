name: Verify AXEZENT research website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reassemble original binary assets with checksum verification
        run: python scripts/reassemble_assets.py
      - name: Validate links, math references, model headers, and checksums
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript syntax
        run: node --check js/site.js
